name: reel_tune
description: ReelTune - your music player for short-form video audio.
publish_to: 'none'
version: 0.0.2+9

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  file_picker: ^13.0.0
  just_audio_background: ^0.0.1-beta.17
  receive_intent: ^0.2.8
  audio_session: ^0.2.4
  reorderable_grid_view: ^2.2.8
  # Subscriptions. RevenueCat wraps Play Billing and keeps the entitlement
  # state in one place; the SDK key is injected at build time (see lib/billing.dart).
  purchases_flutter: ^11.0.0
  # RevenueCat AdMob adapter: reports ad impressions, revenue and clicks to
  # RevenueCat Charts alongside subscription revenue. Free.
  purchases_admob_flutter: ^11.0.0
  google_mobile_ads: ^8.0.0
  # Local purchase-summary PDF. Generated on the device, saved through the
  # system file picker; nothing is emailed or uploaded.
  pdf: ^3.11.3
  # Redeem codes and the code dashboard talk to the Cloudflare Worker.
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Two fixes only, both in `getRelativeIndex` / `onTaskRemoved`:
#  1. LoopMode.one (ReelTunes' per-track looping) made the media session's
#     next/previous buttons restart the current track instead of skipping.
#  2. Swiping the app from Recents left the media notification behind.
# Upstream is 0.0.1-beta.17 and this is the latest release, so the package is
# carried locally until it is fixed upstream. See the two "ReelTunes patch"
# comments in packages/just_audio_background/lib/just_audio_background.dart.
dependency_overrides:
  just_audio_background:
    path: packages/just_audio_background

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
